name: Consolidate V2 Baseline

on:
  push:
    branches:
      - spec/rhct-data-002-database-v2
    paths:
      - '.github/workflows/consolidate-v2-baseline.yml'

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Consolidate validated SQL fragments
        shell: bash
        run: |
          set -euo pipefail
          cd database-v2/baseline
          test -f 00000000000000_baseline_v2.sql
          test -f 00000000000001_real_project_hardening_review.sql
          test -f 00000000000002_app_cutover_review.sql
          test -f 00000000000003_atomic_workout_draft_upsert.sql

          cat \
            00000000000000_baseline_v2.sql \
            00000000000001_real_project_hardening_review.sql \
            00000000000002_app_cutover_review.sql \
            00000000000003_atomic_workout_draft_upsert.sql \
            > /tmp/00000000000000_baseline_v2.sql

          mv /tmp/00000000000000_baseline_v2.sql 00000000000000_baseline_v2.sql
          rm \
            00000000000001_real_project_hardening_review.sql \
            00000000000002_app_cutover_review.sql \
            00000000000003_atomic_workout_draft_upsert.sql

      - name: Verify one canonical baseline remains
        shell: bash
        run: |
          set -euo pipefail
          count=$(find database-v2/baseline -maxdepth 1 -type f -name '*.sql' | wc -l)
          test "$count" -eq 1
          grep -q 'save_workout_draft_v2' database-v2/baseline/00000000000000_baseline_v2.sql
          grep -q 'save_workout_session_v2' database-v2/baseline/00000000000000_baseline_v2.sql
          grep -q 'claim_profile_invitation' database-v2/baseline/00000000000000_baseline_v2.sql
          grep -q 'admin_set_user_role_impl' database-v2/baseline/00000000000000_baseline_v2.sql

      - name: Remove one-shot workflow
        run: rm .github/workflows/consolidate-v2-baseline.yml

      - name: Commit consolidated baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add database-v2/baseline .github/workflows/consolidate-v2-baseline.yml
          git commit -m 'chore(db): consolidate validated V2 baseline'
          git push origin HEAD:spec/rhct-data-002-database-v2

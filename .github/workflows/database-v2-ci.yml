name: Database V2 CI

on:
  pull_request:
    paths:
      - 'database-v2/**'
      - '.github/workflows/database-v2-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Prepare isolated V2 project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tmp-rhct-v2
          mkdir .tmp-rhct-v2
          cd .tmp-rhct-v2
          supabase init
          mkdir -p supabase/migrations
          cp ../database-v2/baseline/*.sql supabase/migrations/

      - name: Start clean local Supabase and apply V2 SQL
        shell: bash
        run: |
          set -euo pipefail
          cd .tmp-rhct-v2
          supabase start
          supabase db reset

      - name: Run V2 adversarial SQL tests
        shell: bash
        run: |
          set -euo pipefail
          cd .tmp-rhct-v2
          eval "$(supabase status -o env | sed 's/^/export /')"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f ../database-v2/tests/rls_and_integrity.sql

      - name: Stop local Supabase
        if: always()
        shell: bash
        run: |
          cd .tmp-rhct-v2 2>/dev/null || exit 0
          supabase stop --no-backup || true
